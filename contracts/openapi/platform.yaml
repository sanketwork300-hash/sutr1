openapi: 3.1.0
info:
  title: Sutr platform API
  version: 1.0.0
  description: 'The /v1 surface: standard response envelope, cursor pagination, and the platform error
    shape. The /api surface is frozen for backward compatibility and is described by the server''s own
    /openapi.json (ADR-004).'
paths:
  /v1/platform/capabilities:
    get:
      tags:
      - platform
      summary: Get Capabilities
      operationId: get_capabilities_v1_platform_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Capabilities V1 Platform Capabilities Get
  /v1/platform/services:
    get:
      tags:
      - platform
      summary: Get Services
      description: 'The service map and plane split this build was assembled from.


        Useful when reading logs or planning a split: it answers "which service

        owns this table?" without grepping.'
      operationId: get_services_v1_platform_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Services V1 Platform Services Get
  /v1/platform/mode:
    get:
      tags:
      - platform
      summary: Get Mode
      description: Whether this instance may write, and which region owns writes if not.
      operationId: get_mode_v1_platform_mode_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Mode V1 Platform Mode Get
  /v1/platform/leadership:
    get:
      tags:
      - platform
      summary: Get Leadership
      description: 'Which replica is running each job that must run exactly once.


        Answers "which one is sweeping?" — the question an operator asks first when

        a background job has not run, and the one that is hardest to answer from

        outside.'
      operationId: get_leadership_v1_platform_leadership_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Leadership V1 Platform Leadership Get
  /v1/platform/scaling:
    get:
      tags:
      - platform
      summary: Get Scaling
      description: What is still per-process when this runs on more than one replica.
      operationId: get_scaling_v1_platform_scaling_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Scaling V1 Platform Scaling Get
  /v1/observability/capabilities:
    get:
      tags:
      - observability
      summary: Capabilities
      description: What this install's telemetry actually does right now.
      operationId: capabilities_v1_observability_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Capabilities V1 Observability Capabilities Get
  /v1/observability/summary:
    get:
      tags:
      - observability
      summary: Summary
      description: Call rate, error ratio and latency percentiles for the caller's org.
      operationId: summary_v1_observability_summary_get
      parameters:
      - name: window_hours
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 24
          title: Window Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Summary V1 Observability Summary Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/observability/operations:
    get:
      tags:
      - observability
      summary: List Operations
      description: The caller's recent operations, one row per correlation id.
      operationId: list_operations_v1_observability_operations_get
      parameters:
      - name: window_hours
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 24
          title: Window Hours
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Operations V1 Observability Operations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/observability/operations/{correlation_id}:
    get:
      tags:
      - observability
      summary: Get Operation
      description: 'One operation''s timeline.


        An id belonging to another tenant is a 404 here, exactly as an id that

        never existed is: any other answer would turn this route into a way to ask

        whether another tenant made a particular call.'
      operationId: get_operation_v1_observability_operations__correlation_id__get
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
          title: Correlation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Operation V1 Observability Operations  Correlation Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resilience/policy:
    get:
      tags:
      - resilience
      summary: Get Policy
      description: The failure-handling policy this build was assembled with.
      operationId: get_policy_v1_resilience_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Policy V1 Resilience Policy Get
  /v1/resilience/providers:
    get:
      tags:
      - resilience
      summary: Get Providers
      description: 'Circuit state and health score per provider, as *this replica* sees it.


        Per replica, because the breaker is per process (see

        `/v1/platform/scaling`). Another replica may be serving a provider this one

        has quarantined, which is deliberate: one replica''s bad network should not

        take a provider away from every other.'
      operationId: get_providers_v1_resilience_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Providers V1 Resilience Providers Get
  /v1/resilience/providers/{provider}/close:
    post:
      tags:
      - resilience
      summary: Close Circuit
      description: 'Close a circuit now, for an operator who has fixed the upstream.


        Audited, because it is a deliberate act on shared state that changes what

        every caller on this replica experiences.'
      operationId: close_circuit_v1_resilience_providers__provider__close_post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Close Circuit V1 Resilience Providers  Provider  Close Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/events:
    get:
      tags:
      - events
      summary: List Events
      description: Recent events, newest first, cursor-paginated (LLD §5.5).
      operationId: list_events_v1_events_get
      parameters:
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: correlation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Events V1 Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/events/dead-letter:
    get:
      tags:
      - events
      summary: List Dead Letter
      description: Events the relay gave up on. The LLD's "manual investigation" queue.
      operationId: list_dead_letter_v1_events_dead_letter_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Dead Letter V1 Events Dead Letter Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/events/{event_id}/retry:
    post:
      tags:
      - events
      summary: Retry Event
      description: 'Return a failed or dead-lettered event to the queue.


        Idempotent by nature rather than by key: an event already pending or

        published is returned unchanged, because "make this event pending" has the

        same result however many times it is asked.'
      operationId: retry_event_v1_events__event_id__retry_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Retry Event V1 Events  Event Id  Retry Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/connectors:
    get:
      tags:
      - sources
      summary: List Connectors
      description: 'Every source type, including the ones declared but not built.


        A source type that is silently missing looks like an oversight; one listed

        as unavailable with a reason is a decision somebody made.'
      operationId: list_connectors_v1_sources_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Connectors V1 Sources Connectors Get
  /v1/sources/discover:
    post:
      tags:
      - sources
      summary: Discover
      description: What definitions live at a source, before committing to one.
      operationId: discover_v1_sources_discover_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sutr__api__v1__sources__DiscoverRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Discover V1 Sources Discover Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/validate:
    post:
      tags:
      - sources
      summary: Validate Document
      description: 'Translate a document and report every stage.


        The same pipeline an import runs, so what this says is what an import will

        do — including which stage would fail, and why.'
      operationId: validate_document_v1_sources_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Validate Document V1 Sources Validate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources:
    get:
      tags:
      - sources
      summary: List Sources
      operationId: list_sources_v1_sources_get
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Sources V1 Sources Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - sources
      summary: Create Source
      description: 'Attach a source to a project, checking it is reachable first.


        Connecting before storing means a mistyped URL or a missing token is

        reported while the user is still looking at the form, rather than an hour

        later in a sync log nobody reads.'
      operationId: create_source_v1_sources_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Source V1 Sources Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/{source_id}:
    get:
      tags:
      - sources
      summary: Get Source
      operationId: get_source_v1_sources__source_id__get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Source V1 Sources  Source Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sources
      summary: Update Source
      operationId: update_source_v1_sources__source_id__patch
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Source V1 Sources  Source Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sources
      summary: Delete Source
      operationId: delete_source_v1_sources__source_id__delete
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/{source_id}/check:
    post:
      tags:
      - sources
      summary: Check Now
      description: Fetch the source now and report what changed.
      operationId: check_now_v1_sources__source_id__check_post
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Check Now V1 Sources  Source Id  Check Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/{source_id}/compare/{other_source_id}:
    post:
      tags:
      - sources
      summary: Compare Two
      description: 'Report where two attached sources disagree.


        The LLD''s governance differentiator (§3.3): a team whose source of truth is

        a repository while a gateway also publishes a definition finds out the two

        have diverged, rather than hearing it from a caller.'
      operationId: compare_two_v1_sources__source_id__compare__other_source_id__post
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      - name: other_source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Other Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Compare Two V1 Sources  Source Id  Compare  Other Source Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/{source_id}/drift:
    get:
      tags:
      - sources
      summary: List Drift
      operationId: list_drift_v1_sources__source_id__drift_get
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Drift V1 Sources  Source Id  Drift Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/drift/{report_id}/apply:
    post:
      tags:
      - sources
      summary: Apply Drift
      description: 'Take a withheld change into the project.


        This is where a human says yes to a breaking change — the decision build

        prompt §13 requires to exist. Applying updates the project''s definition; it

        does **not** recompile or redeploy, because those have their own gates.'
      operationId: apply_drift_v1_sources_drift__report_id__apply_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Apply Drift V1 Sources Drift  Report Id  Apply Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sources/drift/{report_id}/dismiss:
    post:
      tags:
      - sources
      summary: Dismiss Drift
      description: Record that a human looked and chose not to take the change.
      operationId: dismiss_drift_v1_sources_drift__report_id__dismiss_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Dismiss Drift V1 Sources Drift  Report Id  Dismiss Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documentation/capabilities:
    get:
      tags:
      - documentation
      summary: Capabilities
      description: 'What this deployment can actually do to a document.


        Reported rather than assumed: PDF parsing needs a library or a binary, OCR

        needs Tesseract, and semantic search needs an embedding provider. A caller

        should be able to find out that a scanned PDF will come back empty *before*

        uploading it, and to see that search is lexical rather than discovering it

        from disappointing results.'
      operationId: capabilities_v1_documentation_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Capabilities V1 Documentation Capabilities Get
  /v1/documentation/jobs:
    post:
      tags:
      - documentation
      summary: Create Job
      description: 'The LLD §3.5 job interface: `{provider_id, document_uri, document_type}`.


        Two ways in: a `document_uri` we fetch (SSRF-screened like every other

        outbound fetch), or inline `content` for small text documents. File uploads

        go to `POST /documents` — FastAPI cannot serve JSON and multipart from one

        route, and forcing them together would make the LLD''s own interface the

        awkward one.'
      operationId: create_job_v1_documentation_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Job V1 Documentation Jobs Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documentation/documents:
    post:
      tags:
      - documentation
      summary: Upload Document
      description: Upload a document directly. Same pipeline, same response as `/jobs`.
      operationId: upload_document_v1_documentation_documents_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_v1_documentation_documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Upload Document V1 Documentation Documents Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - documentation
      summary: List Documents
      operationId: list_documents_v1_documentation_documents_get
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: document_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Documents V1 Documentation Documents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documentation/jobs/{job_id}:
    get:
      tags:
      - documentation
      summary: Get Job
      operationId: get_job_v1_documentation_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job V1 Documentation Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documentation/documents/{document_id}/reprocess:
    post:
      tags:
      - documentation
      summary: Reprocess
      description: 'Run the pipeline again over a document already in the platform.


        A fresh job, not a resumed one: reprocessing is what you do when the

        extractor has changed, and reusing the old job''s checkpoints would skip

