# Replication needs its own rule; the stock file has none, so a replica's base
# backup is refused and the stack comes up looking healthy with no replication.
#
# scram-sha-256 everywhere except the container's own unix socket, which is how
# the entrypoint initialises the cluster before any password exists.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
host    replication     replicator      all                     scram-sha-256
