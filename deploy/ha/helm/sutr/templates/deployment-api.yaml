apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sutr.fullname" . }}-api
  labels:
    {{- include "sutr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sutr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the declared replicas during a rollout: a new Pod
      # becomes ready before an old one is taken away.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "sutr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the Pods when the configuration changes. Without this a
        # `helm upgrade` that only edits config changes nothing at all.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sutr.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for an in-flight MCP stream to finish rather than being cut
      # off mid-response.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "sutr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # Which Pod and node a log line came from, without the process
            # having to ask the Kubernetes API for it.
            - name: SUTR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SUTR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: {{ include "sutr.fullname" . }}-config
            - secretRef:
                name: {{ include "sutr.secretName" . }}
          # Liveness checks the process and nothing else. A liveness probe that
          # failed on a database outage would restart every replica at once and
          # turn a recoverable incident into a longer one.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness checks the database, so a replica that cannot reach it
          # leaves the Service while staying alive to be looked at.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Migrations run as a hook, and a Pod that starts before they finish
          # should wait rather than crash-loop. Startup is generous for that.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.api.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew }}
          topologyKey: {{ .Values.api.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.api.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sutr.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
