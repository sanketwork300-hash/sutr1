{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sutr.serviceAccountName" . }}
  labels:
    {{- include "sutr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application talks to no Kubernetes API, so it is given no token to do it
# with. A mounted token is a credential an attacker inside the Pod would find.
automountServiceAccountToken: false
{{- end }}
