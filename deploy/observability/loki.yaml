# Loki, single binary, filesystem storage.
#
# `auth_enabled: false` makes this install one Loki tenant, and that is the
# deliberate choice: the platform's own log stream is what ships here, and it
# carries every organisation's lines. Tenant isolation is enforced where a
# tenant actually asks — /v1/observability, which reads this platform's own
# tables scoped to the caller — not by trusting an X-Scope-OrgID header that
# whoever queries Loki would be setting for themselves.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Log lines are JSON objects with a fixed field set, so they are small and
  # numerous rather than large and rare.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 744h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
