# Fluent Bit — container stdout to Loki.
#
# Sutr writes one JSON object per line (LOG_FORMAT=json), so the parser here
# only has to lift that object out of Docker's own envelope; nothing needs to
# be pattern-matched out of a text line, and no field has to be guessed.
#
# Redaction is NOT done here. It happens in the application's log formatter,
# before the line is written, because a credential that reaches stdout has
# already been written to the container's log file — masking it downstream
# would hide it from Loki and leave it on disk.

[SERVICE]
    flush        5
    daemon       Off
    log_level    info
    parsers_file parsers.conf

[INPUT]
    Name              tail
    Tag               sutr.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name         parser
    Match        sutr.*
    Key_Name     log
    Parser       sutr_json
    Reserve_Data On

[OUTPUT]
    Name     loki
    Match    sutr.*
    Host     loki
    Port     3100
    # Labels are the low-cardinality fields only. correlation_id, trace_id and
    # tenant_id stay inside the line: as labels they would create one stream
    # per request, which is how a Loki install is destroyed.
    labels   job=sutr
    label_keys $level,$service,$logger
    line_format json
