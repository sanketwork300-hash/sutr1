# Tempo, single binary, local storage.
#
# It receives OTLP from the collector — never directly from the application, so
# there is exactly one place where telemetry leaves the platform and exactly one
# place to put mTLS.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # A short window: this is a local stack, and a trace that has not been read
  # within an hour of being written is not going to be.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
