[project]
# Distribution is `sutr-sdk` and the import package is `sutr_sdk`, deliberately
# NOT `sutr`: the Sutr server itself installs a top-level `sutr` package, and a
# name collision would make the two uninstallable in the same interpreter.
name = "sutr-sdk"
version = "0.1.0"
description = "Python SDK for Sutr — the governed tool gateway for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/sutr-dev/sutr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sutr_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# N818 wants every exception to end in "Error". Declined for this module, on
# purpose: ApprovalRequired, ApprovalPending, and ToolDenied are expected
# control-flow outcomes of Sutr's governance model, not faults — naming them
# "...Error" would misdescribe them (cf. StopIteration, KeyboardInterrupt). The
# rest of the hierarchy keeps the same convention so the public API is
# internally consistent, and the TypeScript SDK uses these same names.
"src/sutr_sdk/errors.py" = ["N818"]
