[project]
name = "sutr"
version = "0.1.0"
description = "Universal tool gateway for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # Pinned directly although it arrives through FastAPI: starlette 1.0.0
    # rebuilt `request.url` from an unvalidated Host header and an unvalidated
    # path, which lets path-based authorization in middleware be bypassed
    # (PYSEC-2026-161, -248), ignored form limits for urlencoded bodies
    # (-249), and dispatched non-standard HTTP methods to endpoint attributes
    # (-2280). Found by the pip-audit gate in Phase 13.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    # Held on the 1.x line. 1.28.1 clears the three advisories the pip-audit
    # gate found (PYSEC-2026-3481, -3482, -3483); 2.x renames the transport
    # entry points (`streamablehttp_client` → `streamable_http_client`) and is
    # a migration rather than a patch — tracked separately, not smuggled into
    # a security bump.
    "mcp>=1.28.1,<2",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.12.1",
    # >=0.0.31: 0.0.24 carries five advisories found by the pip-audit gate in
    # Phase 13 — quadratic parsing of `;`-separated form bodies, unbounded part
    # headers, an unbounded read on a negative Content-Length, and a `;`
    # separator differential that lets form fields be smuggled past an
    # inspecting proxy.
    "python-multipart>=0.0.31",
    "bcrypt>=5.0.0",
    "python-dotenv>=1.2.2",
    "aiofiles>=24.1.0",
    "resend>=2.28.1",
    "cryptography>=43.0.0",
    "posthog>=7.12.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "stripe>=10.0.0",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7.1",
    "prometheus-client>=0.21.0",
]

[project.scripts]
# MCP over stdio for clients that can only launch a subprocess.
# Identity comes from SUTR_API_KEY; see sutr/mcp/stdio.py.
sutr-mcp-stdio = "sutr.mcp.stdio:main"
# The event relay, for deployments with more than one API replica.
sutr-event-relay = "sutr.events.worker:main"

[project.optional-dependencies]
# Install exactly one of these depending on environment:
#   dev/local:  uv sync --extra postgres-binary
#   production: uv sync --extra postgres  (compiled against system libpq)
postgres = ["psycopg2>=2.9.0"]
postgres-binary = ["psycopg2-binary>=2.9.0"]
aws = ["boto3>=1.34.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    # The OpenTelemetry SDK is optional at runtime and required in CI: the
    # trace-propagation tests assert the joins between Gateway, Discovery,
    # Runtime and Provider spans, and a suite that skipped them would leave
    # LLD §5.3.3 tested nowhere.
    "opentelemetry-sdk>=1.27.0",
]
# The Kafka event-bus backend. Optional: the default in-process bus needs
# no broker, so a single-container install works with neither.
kafka = ["confluent-kafka>=2.5.0"]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sutr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.8.0",
]
