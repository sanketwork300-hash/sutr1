# Upgrading from an image built before the container ran as a non-root user?
# The data volume is owned by root and Docker will not re-own an existing one.
# Once, before starting:
#
#   docker run --rm -v sutr1_sutr_data:/data alpine chown -R 1000:1000 /data
#
# A fresh install needs nothing: the volume inherits ownership from the image.
services:
  sutr:
    build:
      context: .
      dockerfile: Dockerfile
    image: sutr:local
    container_name: sutr
    ports:
      - "4747:4747"
    environment:
      PORT: "4747"
      DATABASE_URL: "sqlite:////data/sutr.db"
      BASE_URL: "http://localhost:4747"
      UI_BASE_URL: "http://localhost:4747"
      OAUTH_CALLBACK_URL: "http://localhost:4747/api/auth/callback"
      IS_SELF_HOSTED: "true"
      SKIP_EMAIL_VERIFICATION: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - sutr_data:/data
      # Generated keys live on their own volume, apart from the database: a
      # copy of /data (a backup, a replica, a laptop) must not also carry the
      # key that mints sessions and the key that decrypts stored credentials.
      # An older install's /data/jwt_secret is copied across on first boot.
      - sutr_secrets:/secrets
    command: >
      sh -c '
        SECRETS_DIR=/secrets;
        if [ ! -w /secrets ]; then
          echo "warning: /secrets is not writable; keeping generated keys on /data" >&2;
          SECRETS_DIR=/data;
        fi;
        if [ -z "$$JWT_SECRET_KEY" ]; then
          if [ ! -f $$SECRETS_DIR/jwt_secret ] && [ -f /data/jwt_secret ]; then
            cp /data/jwt_secret $$SECRETS_DIR/jwt_secret;
          fi;
          if [ ! -f $$SECRETS_DIR/jwt_secret ]; then
            python -c "import secrets; print(secrets.token_hex(32))" > $$SECRETS_DIR/jwt_secret;
          fi;
          export JWT_SECRET_KEY=$$(cat $$SECRETS_DIR/jwt_secret);
        fi;
        if [ -z "$$SECRETS_ENCRYPTION_KEY" ]; then
          if [ ! -f $$SECRETS_DIR/secrets_encryption_key ]; then
            python -c "import secrets; print(secrets.token_hex(32))" > $$SECRETS_DIR/secrets_encryption_key;
          fi;
          export SECRETS_ENCRYPTION_KEY=$$(cat $$SECRETS_DIR/secrets_encryption_key);
        fi &&
        uv run alembic upgrade head &&
        exec ./start.sh
      '
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4747/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sutr_data:
  sutr_secrets:
