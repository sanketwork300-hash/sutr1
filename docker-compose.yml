# Upgrading from an image built before the container ran as a non-root user?
# The data volume is owned by root and Docker will not re-own an existing one.
# Once, before starting:
#
#   docker run --rm -v sutr1_sutr_data:/data alpine chown -R 1000:1000 /data
#
# A fresh install needs nothing: the volume inherits ownership from the image.
services:
  sutr:
    build:
      context: .
      dockerfile: Dockerfile
    image: sutr:local
    container_name: sutr
    ports:
      - "4747:4747"
    environment:
      PORT: "4747"
      DATABASE_URL: "sqlite:////data/sutr.db"
      BASE_URL: "http://localhost:4747"
      UI_BASE_URL: "http://localhost:4747"
      OAUTH_CALLBACK_URL: "http://localhost:4747/api/auth/callback"
      IS_SELF_HOSTED: "true"
      SKIP_EMAIL_VERIFICATION: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - sutr_data:/data
    command: >
      sh -c '
        if [ -z "$$JWT_SECRET_KEY" ]; then
          if [ ! -f /data/jwt_secret ]; then
            python -c "import secrets; print(secrets.token_hex(32))" > /data/jwt_secret;
          fi;
          export JWT_SECRET_KEY=$$(cat /data/jwt_secret);
        fi &&
        uv run alembic upgrade head &&
        exec ./start.sh
      '
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4747/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sutr_data:
